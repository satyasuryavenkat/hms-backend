spring:
  datasource:
    url: jdbc:h2:mem:hms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  jwt:
    secret: test-secret-that-is-at-least-thirty-two-characters-long
    access-minutes: 60
    refresh-days: 7
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Content-Disposition
    allow-credentials: true
    max-age: 3600
  bootstrap:
    enabled: true
    admin-username: admin@medora.in
    admin-password: test-admin-password
