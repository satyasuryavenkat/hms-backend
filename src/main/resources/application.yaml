spring:
  application:
    name: hms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:surya}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:0}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    access-minutes: 60
    refresh-days: 7
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Content-Disposition
    allow-credentials: true
    max-age: 3600
  bootstrap:
    enabled: ${BOOTSTRAP_DATA:false}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:lsadmin@gmail.com}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:lsadmin@2026}
  followups:
    reminder-cron: "${FOLLOWUP_REMINDER_CRON:0 0 */3 * * *}"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
